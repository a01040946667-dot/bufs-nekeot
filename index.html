<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEDEF">
<title>네컷 부스</title>
<link rel="stylesheet" href="vendor/phosphor-bold.css">
<style>
@font-face{font-family:"Pretendard Variable";src:url(vendor/PretendardVariable.woff2) format("woff2-variations"),url(vendor/PretendardVariable.woff2) format("woff2");font-weight:45 920;font-display:swap}
/* 키오스크용 단일 라이트 테마: 밝은 부스 + 핑크 포인트 하나 */
:root{
  --ground:#ECEDEF; --surface:#FFFFFF; --ink:#141518; --mute:#5E626B; --line:#D5D7DC;
  --pop:#FF3D7F;
  --shadow:0 18px 50px rgba(20,21,24,.16);
  --r:20px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;letter-spacing:-.01em;
  overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pop);outline-offset:3px}

/* 상단 바: 이전 + 단계 표시 */
header{position:fixed;inset:0 0 auto;height:72px;display:grid;grid-template-columns:170px 1fr 170px;align-items:center;padding:0 20px;z-index:3}
/* 이전·처음으로: 손가락으로 누르기 쉬운 큰 알약 버튼 */
.back{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border:1px solid var(--line);border-radius:99px;
  background:var(--surface);font-size:18px;font-weight:700;color:var(--ink);justify-self:start;white-space:nowrap}
.back i{font-size:22px}
.back.home{grid-column:3;justify-self:end}
.stepper{grid-column:2;display:flex; /* 촬영 중 이전 버튼이 숨어도 가운데 칸에 고정 */justify-content:center;gap:6px;margin:0;padding:0;list-style:none}
.stepper li{white-space:nowrap;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--mute);padding:8px 14px;border-radius:99px}
.stepper li b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--mute);font-size:12px}
.stepper li.done b{background:var(--ink);color:#fff}
.stepper li.now{background:var(--surface);color:var(--ink)}
.stepper li.now b{background:var(--pop);color:var(--ink)}

/* 화면 공통 */
.screen{position:fixed;inset:72px 0 0;display:flex;gap:40px;padding:12px 40px 32px;animation:enter .45s cubic-bezier(.16,1,.3,1)}
.screen.full{inset:0;padding:40px 56px}
@keyframes enter{from{opacity:0;transform:translateX(24px)}}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.2;text-wrap:balance}
.sub{margin:8px 0 0;font-size:17px;color:var(--mute);line-height:1.5}
.col{display:flex;flex-direction:column;gap:24px;min-width:0;min-height:0}
.grow{flex:1}
.slot{display:flex;align-items:center;justify-content:center;min-height:0}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;border-radius:99px;
  padding:16px 28px;font-size:18px;font-weight:700;background:var(--surface);border:1px solid var(--line);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn i{font-size:22px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pop{background:var(--pop);color:var(--ink);border-color:var(--pop)}
.btn.big{padding:22px 44px;font-size:22px}
.btn.quiet{background:transparent;border-color:transparent;color:var(--mute)}
.actions{display:flex;gap:12px;flex-wrap:wrap}

/* 시작 */
.hero{display:flex;flex-direction:column;justify-content:center;gap:36px;flex:1;max-width:520px}
.hero h1{font-size:64px;letter-spacing:-.04em}
.hero .sub{font-size:20px}
.fan{flex:1;position:relative;min-width:0;container-type:size}
/* 부채꼴 카드 = 실제 네컷 세로 프레임 (canvas, 1:3) */
.fan canvas{position:absolute;top:50%;left:50%;height:min(94cqh,120cqw);width:auto;border-radius:4px;box-shadow:var(--shadow)}
.fan canvas:nth-child(1){transform:translate(-145%,-50%) rotate(-8deg)}
.fan canvas:nth-child(2){transform:translate(-50%,-52%) rotate(-1deg);z-index:1}
.fan canvas:nth-child(3){transform:translate(45%,-50%) rotate(7deg)}
/* 시작 화면 등장: 카드가 가운데 모였다 펼쳐지고, 그 뒤 살짝 떠다님 (translate는 transform과 따로 합쳐짐) */
[data-screen="start"]{animation:none;isolation:isolate;
  --b1:rgba(255,61,127,.28);--b2:rgba(120,180,255,.34);--b3:rgba(255,196,120,.32)}/* 시작 배경: 번진 색 덩어리가 천천히 흐름 (fixed라 세로 화면 스크롤을 안 만듦) */
[data-screen="start"]::before{content:"";position:fixed;inset:-25%;z-index:-2;
  background:radial-gradient(38% 34% at 22% 30%,var(--b1),transparent 70%),
    radial-gradient(36% 40% at 78% 24%,var(--b2),transparent 70%),
    radial-gradient(42% 36% at 64% 82%,var(--b3),transparent 70%);
  filter:blur(20px);animation:drift 18s ease-in-out infinite alternate}
[data-theme="startup"] [data-screen="start"]{--b1:rgba(30,90,200,.32);--b2:rgba(255,140,40,.34);--b3:rgba(80,170,255,.3)} /* 부산 바다 파랑 + 주황 */
[data-theme="bufs"]{--pop:#F28C28} /* 부산외대 전공설명회: 행사 포스터 가을 주황 */
[data-theme="bufs"] [data-screen="start"]{--b1:rgba(40,160,160,.34);--b2:rgba(242,140,40,.34);--b3:rgba(250,200,90,.32)} /* 부스 청록 + 가을 주황·노랑 */
@keyframes drift{to{transform:translate(6%,-4%) rotate(8deg) scale(1.08)}}
/* 교회·부외대 테마: 언덕 위 건물 그림을 배경으로, 아주 천천히 다가감 */
:is([data-theme="church"],[data-theme="bufs"]) [data-screen="start"]::before{inset:0;filter:none;
  background:url(frames/church-morning-sq.jpg) center bottom/cover;animation:approach 40s ease-in-out infinite alternate}
[data-theme="bufs"] [data-screen="start"]::before{background-image:url(frames/bufs-start-sq.jpg)} /* 부외대: 가을 캠퍼스 (교회 배경과 같은 구도) */
@media (orientation:portrait){[data-theme="bufs"] [data-screen="start"]::before{background-image:url(frames/bufs-start-bg.jpg)}}
@media (orientation:portrait){[data-theme="church"] [data-screen="start"]::before{background-image:url(frames/church-morning-bg.jpg)}} /* 시작 배경 전용 (프레임용 church-morning.jpg는 풍경을 아래로 내려서 교회가 작음) */
:is([data-theme="church"],[data-theme="bufs"]) .hero .sub{color:#2A2F38} /* 하늘 위라 회색은 흐림 */
/* 교회 테마: 시작 버튼은 하단 가운데 크게 흰색, 카드는 작게 위로 올려 아래 교회가 보이게 */
:is([data-theme="church"],[data-theme="bufs"]) [data-screen="start"]{padding-bottom:150px}
:is([data-theme="church"],[data-theme="bufs"]) #startBtn{position:fixed;left:50%;bottom:36px;translate:-50% 0;z-index:2;
  background:#fff;border-color:#fff;color:var(--ink);padding:30px 84px;font-size:30px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
:is([data-theme="church"],[data-theme="bufs"]) #startBtn i{font-size:32px}
:is([data-theme="church"],[data-theme="bufs"]) .fan canvas{--fh:min(60cqh,78cqw);height:var(--fh);top:32%} /* --fh = 카드 높이 */
@media (orientation:portrait){:is([data-theme="church"],[data-theme="bufs"]) .fan canvas{--fh:min(74cqh,94cqw);top:calc(var(--fh)/2 + 16px);left:35%}} /* 세로: 글자 바로 밑, 교회(오른쪽 아래) 왼쪽에 */
@media (orientation:landscape){:is([data-theme="church"],[data-theme="bufs"]) .fan canvas{top:42%;left:66%}}
/* 부외대는 4x6 카드(2:3)라 폭이 넓으므로 작게 */
[data-theme="bufs"] .fan canvas{--fh:min(40cqh,44cqw)}
@media (orientation:landscape){[data-theme="bufs"] .fan canvas{left:58%}}
[data-theme="bufs"] #startBtn{bottom:90px} /* 시작 버튼 조금 위로 */
@media (orientation:portrait){[data-theme="bufs"] .fan canvas{--fh:min(40cqh,40cqw);left:38%}}
@keyframes approach{from{transform:scale(1.02)}to{transform:scale(1.1);transform-origin:70% 85%}}
.fan canvas{animation:deal 1.4s cubic-bezier(.16,1,.3,1) both,bob 5s ease-in-out 1.8s infinite}
.fan canvas:nth-child(2){animation-delay:.2s,2.2s}
.fan canvas:nth-child(3){animation-delay:.4s,2.6s}
@keyframes deal{from{opacity:0;transform:translate(-50%,-40%) rotate(0) scale(.85)}}
@keyframes bob{50%{translate:0 -12px}}
.hero>*{animation:up 1.1s cubic-bezier(.16,1,.3,1) both}
.hero>:nth-child(2){animation-delay:.5s}
@keyframes up{from{opacity:0;transform:translateY(20px)}}
#startBtn{animation:breathe 2.4s ease-in-out 1.8s infinite}
@keyframes breathe{50%{box-shadow:0 0 0 12px rgba(255,61,127,.18)}}
/* 감싼 div가 transform 애니메이션을 하면 fixed 버튼이 그 안에 갇히므로, 등장 애니메이션을 버튼으로 옮김 */
:is([data-theme="church"],[data-theme="bufs"]) .hero>:nth-child(2){animation:none}
:is([data-theme="church"],[data-theme="bufs"]) #startBtn{animation:up 1.1s cubic-bezier(.16,1,.3,1) .5s both,breathe-w 2.4s ease-in-out 1.8s infinite}
@keyframes breathe-w{50%{box-shadow:0 0 0 14px rgba(255,255,255,.45)}}

/* 모양 선택 */
.choices{display:flex;gap:28px;justify-content:center;align-items:stretch;flex:1;min-height:0}
.choice{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:18px;width:340px;padding:28px;
  background:var(--surface);border:2px solid transparent;border-radius:var(--r);transition:border-color .2s,transform .15s}
.choice:active{transform:scale(.98)}
.choice[aria-pressed="true"]{border-color:var(--pop)}
.choice .pv{flex:1;min-height:0;display:flex;align-items:center}
.choice canvas{max-height:100%;max-width:100%;box-shadow:0 6px 20px rgba(20,21,24,.14)}
.choice strong{font-size:22px;font-weight:800}
.choice span{font-size:15px;color:var(--mute);margin-top:-12px}

/* 결과 미리보기 */
.print{position:relative;height:100%;max-width:100%;aspect-ratio:1/3;box-shadow:0 2px 4px rgba(20,21,24,.08),var(--shadow)}
.print.square{aspect-ratio:2/3}
#strip{display:block;width:100%;height:100%}
.cut{position:absolute;border:0;padding:0;background:transparent;border-radius:6px;display:none;pointer-events:none}
.cut span{pointer-events:auto}
.cut[hidden]{display:none!important} /* 3컷 프레임에서 안 쓰는 칸 */
.print.ready{touch-action:none}
.print.pen .cut{display:none!important}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;max-height:min(28dvh,250px);overflow:auto;padding:3px}
.stickers button{font-size:30px;line-height:1;padding:8px 0;display:grid;place-items:center;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.stickers button[aria-pressed="true"]{border-color:var(--pop)}
.stickers img{width:36px;height:36px;object-fit:contain}
.print.ready .cut{display:block}
.cut span{position:absolute;right:6px;top:6px;display:inline-flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:99px;background:rgba(20,21,24,.7);color:#fff;font-size:13px;font-weight:700}
.cut:focus-visible{background:rgba(255,61,127,.2)}

/* 프레임 선택 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px;overflow:auto;padding:4px;align-content:start}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;background:var(--surface);
  border:2px solid transparent;border-radius:16px;font-size:14px;font-weight:700}
.tile[aria-pressed="true"]{border-color:var(--pop)}
.tile .pv{height:132px;display:flex;align-items:center}
.tile canvas{height:100%;width:auto;border-radius:3px;box-shadow:0 2px 8px rgba(20,21,24,.15)}
.tile.add{border:2px dashed var(--line);background:transparent;color:var(--mute);justify-content:center;cursor:pointer}
.tile.add i{font-size:30px}
.tile{position:relative}
.tile .del{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(20,21,24,.75);color:#fff;font-size:16px}
#tiles .admin{display:none} body[data-admin] #tiles .tile.admin{display:flex}
.tile.add:focus-within{outline:3px solid var(--pop);outline-offset:3px}

/* 촬영 */
/* 카메라는 전체 화면. 가운데 밝은 틀(.guide)이 실제로 찍히는 영역이고 밖은 흐리게(.blurout).
   --a = 지금 모양의 사진 칸 비율 (세로 네컷 3:2, 4x6 네컷 세로형). capture()가 이 틀 위치 그대로 잘라 찍음 */
.view{position:fixed;inset:0;overflow:hidden;background:#1d1e22;container-type:size}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.view{--gw:min(calc(100cqw - 48px),calc((100cqh - 84px - 160px)*var(--a,1.5))); /* 틀 폭: 위 바 84px, 아래 셔터 160px 남김 */
  --gt:calc(84px + (100cqh - 84px - 160px - var(--gw)/var(--a,1.5))/2)} /* 틀 위치: 그 사이 세로 가운데 (세로 탭에서 얼굴이 화면 가운데 오므로) */
.guide{position:absolute;left:50%;top:var(--gt);transform:translateX(-50%);width:var(--gw);aspect-ratio:var(--a,1.5);pointer-events:none;
  outline:3px solid rgba(255,255,255,.9)}
/* 틀 밖(잘려 나가는 부분)은 흐리게: 화면 전체를 블러로 덮고 틀 자리만 마스크로 뚫음 */
.blurout{position:absolute;inset:0;pointer-events:none;background:rgba(10,10,12,.18);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  --m:linear-gradient(#000 0 0);
  -webkit-mask:var(--m) 0 0/100% 100% no-repeat,var(--m) 50% var(--gt)/var(--gw) calc(var(--gw)/var(--a,1.5)) no-repeat;
  -webkit-mask-composite:xor;
  mask:var(--m) 0 0/100% 100% no-repeat exclude,var(--m) 50% var(--gt)/var(--gw) calc(var(--gw)/var(--a,1.5)) no-repeat}
.steps{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);width:min(420px,70vw);display:flex;gap:8px}
.steps i{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.35);transition:background .3s}
.steps i.done{background:#fff}
.steps i.now{background:var(--pop)}
.count{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:32px;color:#fff}
.count span{font-weight:900;font-size:min(26vw,34vh);line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 8px 40px rgba(0,0,0,.35);animation:tick 1s cubic-bezier(.16,1,.3,1)}
@keyframes tick{from{transform:scale(1.35);opacity:0}30%{opacity:1}to{transform:scale(1)}}
.count.msg{background:rgba(20,21,24,.72);font-size:20px;font-weight:600;line-height:1.6}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
.flash.on{opacity:1;transition:none}
.shutter{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;
  background:none;border:0;padding:0;font-weight:700;font-size:16px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.shutter b{display:block;width:84px;height:84px;border-radius:50%;background:var(--pop);
  box-shadow:0 0 0 6px rgba(255,255,255,.25),0 0 0 9px #fff;transition:transform .15s}
.shutter:active b{transform:scale(.93)}
.shutter:disabled{opacity:.35}
.toggle.autofix{position:fixed;right:24px;bottom:44px;z-index:2;color:#fff;background:rgba(20,21,24,.55);padding:10px 16px;border-radius:99px}

/* 확인/완성 오른쪽 패널 */
.panel{width:380px;flex:none;justify-content:center}
/* 꾸미기: 결과물은 화면 가운데 크게. 도구(문구·펜·스티커)는 갤럭시 엣지 패널처럼 오른쪽에서 밀려 나옴 */
[data-screen="review"]{padding:8px 24px 16px;justify-content:center}
[data-screen="review"] .slot{overflow:hidden;flex:1}
#reviewPanel{position:fixed;top:84px;right:0;bottom:104px;width:min(360px,86vw);z-index:4;justify-content:flex-start;overflow:auto;
  padding:22px 20px 20px 24px;background:var(--surface);border-radius:24px 0 0 24px;box-shadow:-12px 0 40px rgba(20,21,24,.18);
  transform:translateX(105%);transition:transform .32s cubic-bezier(.16,1,.3,1)}
#reviewPanel.open{transform:none}
.edge{position:fixed;top:50%;right:0;z-index:5;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  width:40px;height:132px;padding:0;border:0;border-radius:16px 0 0 16px;background:var(--ink);color:#fff;font-size:15px;font-weight:700;
  box-shadow:-4px 0 16px rgba(20,21,24,.2);transition:right .32s cubic-bezier(.16,1,.3,1);touch-action:none}
.edge span{writing-mode:vertical-rl;letter-spacing:.1em}
.edge i{font-size:20px;transition:transform .32s}
#reviewPanel.open ~ .edge{right:min(360px,86vw)}
#reviewPanel.open ~ .edge i{transform:rotate(180deg)}
.fab{position:fixed;right:24px;bottom:24px;z-index:5;box-shadow:var(--shadow)}
#stickerTools .stickers{max-height:none}
/* 촬영 중 위쪽 바: 카메라 위라 어둡게 깔고 글자는 흰색 */
body[data-at="shoot"] header{background:linear-gradient(rgba(10,10,12,.6),transparent)}
body[data-at="shoot"] .stepper li:not(.now){color:rgba(255,255,255,.9)}
body[data-at="shoot"] .stepper li.done b{background:#fff;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px;font-weight:700;color:var(--mute)}
#caption,#gptWish{font:inherit;font-size:20px;font-weight:700;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;font-weight:600}
.toggle input{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(20,21,24,.25)}
.toggle input:checked{background:var(--pop)}
.toggle input:checked::after{transform:translateX(18px)}
.field input[type=range]{width:100%;accent-color:var(--pop);height:28px;margin:0}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);padding:0}
.swatches button.auto{width:auto;padding:0 14px;border-radius:99px;background:var(--surface);font-size:14px;font-weight:700}
.swatches button[aria-pressed="true"]{outline:3px solid var(--pop);outline-offset:2px}
.modes,.seg{display:flex;background:var(--line);border-radius:99px;padding:4px}
.seg[hidden]{display:none}
.modes button,.seg button{flex:1;border:0;border-radius:99px;padding:12px;background:none;font-size:16px;font-weight:700;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.modes button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,21,24,.15)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack .btn{width:100%}

/* QR */
dialog{border:0;border-radius:var(--r);padding:32px 36px;background:var(--surface);color:var(--ink);
  text-align:center;max-width:min(90vw,400px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(20,21,24,.45)}
dialog h2{margin:0;font-size:24px;font-weight:800}
#gptWish{font-size:17px;resize:none;margin-bottom:18px;text-align:left}
#qr{display:inline-block;padding:14px;border-radius:14px;border:1px solid var(--line);margin-block:18px}
#qr img,#qr canvas{display:block}
dialog p{margin:0 0 18px;color:var(--mute);line-height:1.6}
.copies{display:flex;align-items:center;justify-content:center;gap:24px;margin:24px 0 28px}
.copies .btn{width:72px;height:72px;padding:0;justify-content:center;border-radius:50%}
.copies .btn i{font-size:28px}
#cpN{min-width:2ch;font-size:56px;font-weight:800;font-variant-numeric:tabular-nums}
/* QR 만드는 동안: 올라가는 아이콘 + 퍼센트 + 진행 바 */
.qrwait{width:240px;height:240px;border-radius:8px;background:#F0F1F3;display:grid;place-content:center;justify-items:center;gap:12px}
.qrwait i{font-size:56px;color:var(--pop);animation:bob 1.2s ease-in-out infinite}
.qrwait b{font-size:34px;font-weight:800}
.qrwait .bar{width:180px;height:10px;border-radius:99px;background:#DADCE0;overflow:hidden}
.qrwait .bar span{display:block;height:100%;width:0;background:var(--pop);transition:width .3s}

.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  padding:14px 22px;border-radius:99px;background:var(--ink);color:#fff;font-size:16px;font-weight:700;box-shadow:var(--shadow);animation:rise .3s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translate(-50%,12px)}}
#printImg{display:none}
@page{size:100mm 148mm;margin:0} /* 캐논 SELPHY CP1500 엽서 용지 */
@media print{
  body{background:#fff}
  body>*{display:none!important}
  #printImg{display:block!important;width:100mm;height:148mm;object-fit:cover} /* 엽서를 꽉 채움 (앱 인쇄와 같음) */
}
@media (orientation:portrait){
  header{grid-template-columns:auto 1fr auto;gap:12px;padding:0 20px}
  .stepper li:not(.now) span{display:none}
  .stepper{gap:2px} .stepper li{padding:8px 8px} .back{padding:0 16px} /* 좁은 세로 화면에서도 처음으로 버튼이 안 잘리게 */
  .screen{flex-direction:column;overflow:auto;gap:28px}
  .screen.full{justify-content:center}
  .hero{flex:none;max-width:none}
  .fan{flex:1;max-height:56dvh}
  .panel{width:100%}
  [data-screen="review"]{overflow:hidden} /* 세로 화면에서도 사진은 가운데 크게, 도구는 엣지 패널 */
  [data-screen="review"] .slot{height:auto;flex:1;padding-bottom:84px} /* 아래 완성하기 버튼 자리 */
  #reviewPanel{width:min(360px,86vw)}
  .slot{height:46dvh;flex:none}
  [data-screen="frame"] .slot{height:34dvh}
}
@media (prefers-reduced-motion:reduce){
  *,*::after{animation:none!important;transition:none!important}
}
</style>

<script>
// 튜닝 노브: 탭 카메라/조명에 맞게 조절
const TARGET_LUM = 0.52;   // 목표 평균 밝기 (0~1)
const WB_STRENGTH = 0.5;   // 화이트밸런스 보정 세기 (0=끔, 1=완전 gray-world)
const GLOW = 0.22;         // 뽀샤시 소프트포커스 세기
const COUNTDOWN = 3;       // 컷당 카운트다운(초)

// S: 결과물 해상도 배율. PW: 찍은 원본의 긴 변 (원본은 사진 칸 비율 그대로 찍음)
const S = 2, PW = 1440;
// 결과물 모양. strip = 2x6인치 세로 네컷(600x1800), square = 4x6인치 세로 2x2(1200x1800) 좌표 (이름은 예전 정사각에서 그대로)
// std/scene: 사진 칸 배치 (scene은 그림 배경용, 칸 아래 풍경 띠를 넓힘). text = [라벨, 문구, 날짜] 글자 y, ts = 글자 배율
const FORMATS = {
  strip: {w: 600, h: 1800, ts: 1,
    std:   {cols: 1, x: 30, top: 30, w: 540, h: 360, gap: 30, text: [1600, 1652, 1700]},
    scene: {cols: 1, x: 36, top: 36, w: 528, h: 352, gap: 14, text: [1622, 1676, 1720]},
    // poster: 포스터 그림 프레임. n = 컷 수(없으면 4), logo = 제목 그림 자리 {x 가운데, y 위, w 폭}, date = 날짜 [x, y]
    banner: {cols: 1, n: 3, x: 36, top: 250, w: 528, h: 352, gap: 14, text: [1622, 1676, 1720], logo: {x: 300, y: 1345, w: 420}, date: [300, 1776], head: {x: 300, y: 50, w: 500}},
    poster: {cols: 1, n: 3, x: 36, top: 36, w: 528, h: 352, gap: 14, text: [1622, 1676, 1720], logo: {x: 300, y: 1140, w: 470}, date: [300, 1762]}},
  square: {w: 1200, h: 1800, ts: 1.45,
    std:   {cols: 2, x: 40, top: 40, w: 550, h: 700, gap: 20, text: [1560, 1636, 1690]},
    scene: {cols: 2, x: 40, top: 40, w: 550, h: 700, gap: 20, text: [1560, 1636, 1690]},
    banner: {cols: 2, x: 120, top: 30, w: 470, h: 598, gap: 20, text: [1560, 1636, 1690], logo: {x: 600, y: 1380, w: 1060}, date: [600, 1780], head: {x: 600, y: 1290, w: 360}},
    poster: {cols: 2, x: 40, top: 40, w: 550, h: 700, gap: 20, text: [1560, 1636, 1690], logo: {x: 300, y: 1485, w: 500}, date: [300, 1760]}},
};
for (const [k, F] of Object.entries(FORMATS)) F.key = k;
const cutCount = () => F[FRAMES[frame].layout || 'std'].n || 4; // 지금 프레임의 컷 수 (보통 4, 세로 네컷 poster는 3)
const slot = (L, i) => [L.x + (i % L.cols)*(L.w + L.gap), L.top + Math.floor(i / L.cols)*(L.h + L.gap), L.w, L.h];
console.assert(slot(FORMATS.square.std, 3).join() === '610,760,550,700' && slot(FORMATS.strip.std, 2).join() === '30,810,540,360', 'slot');

// 프레임 draw(c, F): F 좌표계(F.w x F.h)에 배경을 그림. label: 문구 위 작은 글씨, shadow: 글자 그림자 색
const plain = (bg, ink) => ({ink, draw: (c, F) => { c.fillStyle = bg; c.fillRect(0, 0, F.w, F.h); }});
const cover = (c, img, w, h) => {
  const k = Math.max(w / img.naturalWidth, h / img.naturalHeight);
  c.drawImage(img, (w - img.naturalWidth*k)/2, (h - img.naturalHeight*k)/2, img.naturalWidth*k, img.naturalHeight*k);
};
// 프레임 미리보기용 예시 사진 samples/sample1~4.jpg (같은 세 사람, 네 가지 포즈. art/samples 원본을 줄인 것)
const SAMPLES = [1, 2, 3, 4].map(n => { const im = new Image(); im.onload = () => refresh(); im.src = `samples/sample${n}.jpg`; return im; });
// 그림 배경 frames/<name>.jpg(세로). 두 모양 다 세로라 하늘은 전체에 깔고, 아래 풍경은 폭 맞춤으로 바닥에 붙여서 사진 아래로 보이게
const logoImg = name => { const i = new Image(); i.onload = () => refresh(); i.src = `frames/${name}`; return i; };
function sceneFrame(name, ink, shadow, label) {
  const imgs = {strip: new Image(), square: new Image()};
  imgs.strip.src = `frames/${name}.jpg`; imgs.square.src = `frames/${name}-4x6.jpg`; // 4x6은 2x2 사진 아래 띠에 풍경이 오게 그린 전용 그림
  for (const i of Object.values(imgs)) i.onload = () => refresh();
  return sceneOf(imgs, ink, shadow, label);
}
function sceneOf(imgs, ink, shadow, label) {
  return {ink, shadow, label, layout: 'scene', draw: (c, F) => {
    const img = imgs[F.key];
    if (!img.naturalWidth) { c.fillStyle = '#888'; c.fillRect(0, 0, F.w, F.h); return; }
    cover(c, img, F.w, F.h);
    const h = img.naturalHeight * F.w / img.naturalWidth; c.drawImage(img, 0, F.h - h, F.w, h);
  }};
}

  '치이카와':    {...sceneFrame('chiikawa-cave', '#FFFFFF', 'rgba(10,30,80,.8)'), group: 'custom', layout: 'poster', logo: logoImg('chiikawa-logo.png')},

const THEMES = {

    frames: () => ({
      '주일 아침':      sceneFrame('church-morning', '#FFFFFF', 'rgba(30,60,110,.75)', CHURCH),
      '스테인드글라스': sceneFrame('church-glass', '#FFF3D6', 'rgba(0,0,0,.75)', CHURCH),

      '눈 오는 성탄':   sceneFrame('christmas-snow', '#FFFFFF', 'rgba(60,20,30,.75)', CHURCH),

  },
  startup: {

    title: '부산창업학교 네컷', sub: '우리의 시작을 네 장에 남겨요.',
    fan: ['로켓 발사', '광안대교의 밤', '데모데이'],
    frames: () => ({

      '아이디어':      sceneFrame('startup-idea', '#FFFFFF', 'rgba(0,0,0,.75)', STARTUP),
      '피칭 무대':     sceneFrame('startup-pitch', '#FFFFFF', 'rgba(0,0,0,.75)', STARTUP),
      '데모데이':      sceneFrame('startup-demoday', '#FFFFFF', 'rgba(0,0,0,.75)', STARTUP),
      '성장 그래프':   sceneFrame('startup-growth', '#FFFFFF', 'rgba(0,0,0,.75)', STARTUP),

// 확인 화면 미리보기 위 드래그: 문구 모드면 문구 이동, 펜 모드면 그리기
// S펜을 한 번 쓰면 손 터치로는 안 그려짐 (손바닥 대고 그려도 됨)
{
  let penSeen = false, drag = null, frameReq = 0;
  const redraw = () => frameReq ||= requestAnimationFrame(() => { frameReq = 0; renderStrip(); });
  const at = e => { const r = card.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * F.w, (e.clientY - r.top) / r.height * F.h]; };
  let grab = [0, 0]; // 스티커를 잡은 지점과 중심의 차이
  // 두 손가락 핀치: 손가락이 두 개가 되면 꾸미기(그리기·옮기기)를 멈추고 확대·축소·이동만 함
  const fingers = new Map(); let pinch = null, dragStart = 0;
  const capture = id => { try { card.setPointerCapture(id); } catch {} };
  const pinchState = () => { const [a, b] = [...fingers.values()]; return {d: Math.hypot(a[0]-b[0], a[1]-b[1]), m: [(a[0]+b[0])/2, (a[1]+b[1])/2]}; };
  const pinchMove = e => {
    if (!fingers.has(e.pointerId)) return false;
    fingers.set(e.pointerId, [e.clientX, e.clientY]);
    if (!pinch) return false;
    const {d, m} = pinchState();
    if (pinch.k) { // 고른 스티커: 손가락 벌린 만큼 크기, 가운데 점 따라 이동
      const r = card.getBoundingClientRect(), u = F.w / r.width;
      Object.assign(pinch.k, {size: Math.min(700, Math.max(30, pinch.size * d / pinch.d)), x: pinch.kx + (m[0] - pinch.m[0]) * u, y: pinch.ky + (m[1] - pinch.m[1]) * u});
      redraw(); return true;
    }
    zoom.s = Math.min(4, Math.max(.6, pinch.s * d / pinch.d));
    zoom.x = pinch.x + m[0] - pinch.m[0]; zoom.y = pinch.y + m[1] - pinch.m[1];
    applyZoom(); return true;
  };
  const pinchEnd = e => {
    fingers.delete(e.pointerId);
    if (pinch?.k && fingers.size < 2) { pinch = null; return; }
    if (pinch && fingers.size < 2) { pinch = null; if (Math.abs(zoom.s - 1) < .08) { Object.assign(zoom, {s: 1, x: 0, y: 0}); applyZoom(); } } // 거의 원래 크기면 딱 맞춤
  };
  const move = e => {
    if (pinchMove(e)) return;
    if (e.pointerId !== drag) return;
    const [x, y] = at(e);
    if (pen.mode === 'sticker') Object.assign(stickers.at(-1), {x: x + grab[0], y: y + grab[1]});
    else if (pen.mode === 'pen') strokes.at(-1).pts.push([x, y]);
    else { cap.x = x / F.w * 100; cap.y = (y + cap.size * F.ts * .35) / F.h * 100; } // 손끝이 글자 가운데 오게
    redraw();
  };
  card.addEventListener('pointerdown', e => {
    if (screen !== 'review' || busy || e.target.closest('.cut')) return;
    if (e.pointerType === 'touch') {
      fingers.set(e.pointerId, [e.clientX, e.clientY]); capture(e.pointerId);
      if (fingers.size === 2) { // 두 번째 손가락: 첫 손가락이 방금 시작한 선은 취소하고 핀치 시작 (스티커를 골랐으면 스티커 크기, 아니면 화면 확대)
        if (drag != null && performance.now() - dragStart < 400 && pen.mode === 'pen') strokes.pop();
        const k = pen.mode === 'sticker' && pen.picked && stickers.at(-1);
        drag = null; pinch = {...pinchState(), s: zoom.s, x: zoom.x, y: zoom.y, k, size: k?.size, kx: k?.x, ky: k?.y}; redraw(); return;
      }
      if (fingers.size > 2) return;
    }
    if (e.pointerType === 'pen') penSeen = true;
    if (e.pointerType === 'touch' && penSeen && pen.mode === 'pen') return;
    if (pen.mode === 'sticker') { // 누른 곳에 스티커가 있으면 그걸 고르고(맨 위로) 끌기, 빈 곳이면 고르기 풀기
      const [x, y] = at(e), i = stickers.findLastIndex(k => Math.hypot(k.x - x, k.y - y) < k.size * .6);
      pen.picked = i >= 0; redraw();
      if (i < 0) return;
      stickers.push(...stickers.splice(i, 1));
      const k = stickers.at(-1); grab = [k.x - x, k.y - y];
    }
    capture(e.pointerId); drag = e.pointerId; dragStart = performance.now();
    if (pen.mode === 'pen') strokes.push({color: pen.color, w: +$('penSize').value, pts: []});
    move(e);
  });
  card.addEventListener('pointermove', move);
  card.addEventListener('pointerup', e => { pinchEnd(e); if (e.pointerId === drag) drag = null; });
  card.addEventListener('pointercancel', e => { pinchEnd(e); if (e.pointerId === drag) drag = null; });
}

// 평균 색에서 노출/화이트밸런스 게인 계산 (살짝 따뜻하게)
// ponytail: 전체 평균 기반 gray-world, 배경색이 강하면 틀어짐. 얼굴 기준 보정이 필요하면 얼굴 영역만 샘플링
function gains(mr, mg, mb) {
  const avg = (mr + mg + mb) / 3;
  const lum = Math.max((0.299*mr + 0.587*mg + 0.114*mb) / 255, 0.01);
  const exp = Math.min(Math.max(TARGET_LUM / lum, 0.9), 1.6);
  const wb = c => 1 + (avg / Math.max(c, 1) - 1) * WB_STRENGTH;
  return [wb(mr)*exp*1.02, wb(mg)*exp, wb(mb)*exp*0.98];
}
console.assert(gains(60,60,60)[1] > 1.4, '어두운 사진은 밝아져야 함');
console.assert(Math.abs(gains(133,133,133)[1] - 1) < 0.01, '적정 노출 회색은 그대로');
console.assert(gains(120,120,60)[2] > gains(120,120,60)[0], '노란 캐스트는 파랑을 올려야 함');

function enhance(c) {
  const ctx = c.getContext('2d', {willReadFrequently: true});
  const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 64) { r += d[i]; g += d[i+1]; b += d[i+2]; n++; }
  const [gr, gg, gb] = gains(r/n, g/n, b/n);
  for (let i = 0; i < d.length; i += 4) { d[i] *= gr; d[i+1] *= gg; d[i+2] *= gb; }
  ctx.putImageData(img, 0, 0);
  const o = document.createElement('canvas'); o.width = c.width; o.height = c.height;
  const octx = o.getContext('2d');
  octx.filter = 'contrast(1.05) saturate(1.12)';
  octx.drawImage(c, 0, 0);
  octx.filter = 'blur(10px)'; octx.globalAlpha = GLOW;
  octx.drawImage(c, 0, 0);
  return o;
}

function capture() { // 화면의 밝은 틀(.guide)에 보이는 부분 그대로 잘라 찍음: 긴 변 PW(1440)
  const vw = video.videoWidth, vh = video.videoHeight, a = slotAspect();
  // 비디오는 object-fit:cover로 화면을 채움 → 틀의 화면 좌표를 비디오 픽셀 좌표로 바꿈. 틀은 가운데라 거울 모드여도 위치 같음
  const V = video.getBoundingClientRect(), G = $('guide').getBoundingClientRect(), k = Math.max(V.width / vw, V.height / vh);
  const sx = (G.left - V.left - (V.width - vw*k)/2) / k, sy = (G.top - V.top - (V.height - vh*k)/2) / k, sw = G.width / k, sh = G.height / k;
  const [W, H] = a >= 1 ? [PW, Math.round(PW/a)] : [Math.round(PW*a), PW];
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.translate(W, 0); ctx.scale(-1, 1); // 화면처럼 거울 모드
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
  return $('auto').checked ? enhance(c) : c;
}

  for (let n = COUNTDOWN; n > 0; n--) { count.innerHTML = `<span>${n}</span>`; await sleep(1000); }
  count.textContent = '';
  $('flash').classList.add('on'); photos[i] = capture();
  requestAnimationFrame(() => $('flash').classList.remove('on'));
  steps[i].className = 'done';
  renderStrip(); await sleep(900);
}

// 인쇄 여유(bleed): CP1500은 여백 없음 인쇄에서 그림을 약 7% 키워 가장자리를 잘라냄 (2026-10-03 시험 인쇄: 문구·날짜·옆 여백이 잘림).
// 그래서 인쇄 그림을 엽서(100x148mm)보다 크게 만들고, 늘어난 둘레는 프레임 배경만(사진·글자 없이) 채움 → 잘려도 내용은 안 잘림.
// 둘레 여유(엽서 mm 기준). 시험 인쇄로 맞춤: 양옆 4.3·위 5.5mm일 때 양옆·위에 여분 배경이 1mm쯤 보였고 아래는 맞았음 → 양옆·위 1mm씩 줄임.
// 여분 배경이 보이면 그쪽 값을 줄이고, 내용이 잘리면 늘림. 아래는 나머지(약 3.5mm): 엽서가 사진보다 살짝 짧아서 프레임 맨 아랫단 1.5mm쯤은 잘림 (날짜 아래 여유 약 3mm 안)
// 2026-10-25 시험 인쇄(10/21 설정): 위는 절취선에 딱 맞음, 아래는 약 5mm 잘려 코난 날짜(맨 아래 약 1mm 위)가 걸림
//   → 아래 여유 3.5 → 5mm. 위는 그대로, 용지 비율 때문에 그림이 약 1% 작아지고 양옆 여유 3.3 → 3.8mm
const PRINT_SIDE_MM = 3.8, PRINT_TOP_MM = 4.4, HAGAKI = 148 / 100;
function printSheet() { // 세로 네컷은 두 줄(반으로 자르면 2장), 4x6 네컷은 그대로 한 장
  const two = F === FORMATS.strip, sw = strip.width * (two ? 2 : 1), sh = strip.height;
  const W = Math.round(sw / (1 - 2 * PRINT_SIDE_MM / 100)), H = Math.round(W * HAGAKI);
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  c.width = W; c.height = H;
  // 1) 둘레: 프레임 배경만 (사진·문구 없이) 크게 깔기
  const bg = document.createElement('canvas'); bg.width = strip.width; bg.height = strip.height;
  const b = bg.getContext('2d'); b.scale(bg.width / F.w, bg.height / F.h); FRAMES[frame].draw(b, F);
  const k = Math.max(W / sw, H / sh), bw = strip.width * k, bx = (W - sw * k) / 2, by = (H - sh * k) / 2;
  ctx.drawImage(bg, bx, by, bw, sh * k); if (two) ctx.drawImage(bg, bx + bw, by, bw, sh * k);
  // 2) 완성 사진을 가운데에 원래 크기 그대로
  const x0 = (W - sw) / 2, y0 = Math.min(H * PRINT_TOP_MM / 148, H - sh);
  ctx.drawImage(strip, x0, y0); if (two) ctx.drawImage(strip, x0 + strip.width, y0);
  // 자르는 선 표시 (세로 네컷): 두 줄 사이, 용지 위아래 가장자리에서 사진 시작 조금 아래까지. 흰 테두리+진한 선이라 어떤 배경에서도 보임
  if (two) {
    const x = W / 2, len = y0 + strip.width / 25;
    for (const [w, color] of [[6, '#FFFFFF'], [2, '#555A63']]) {
      ctx.lineWidth = w; ctx.strokeStyle = color;
      for (const [y1, y2] of [[0, len], [H - len, H]]) { ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke(); }
    }
  }
  return c;
}
const stamp = () => new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
const toBlob = c => new Promise(r => c.toBlob(r, 'image/png'));

// 번들러 없이 쓰므로 @capacitor/core의 registerPlugin이 없음 → 브리지의 nativePromise로 직접 호출
const plugin = name => new Proxy({}, {get: (_, method) => opts => Capacitor.nativePromise(name, method, opts)});

}

}

// ponytail: Litterbox(catbox) 임시 업로드. 1시간 후 자동 삭제, 링크 아는 사람은 열람 가능. QR은 받기 페이지(사진 + 저장 버튼) 주소
// (예전 tmpfiles.org는 광고·봇 인증 페이지가 끼어 다운이 안 됐음). 비공개 보관이 필요하면 자체 클라우드 스토리지로 교체
const UPLOAD_TIMEOUT_MS = 30000; // 업로드가 이보다 오래 걸리면 끊고 한 번 더 시도 (예전엔 제한이 없어 진행 막대가 멈춘 채 QR이 안 나옴)
async function upload(blob, name, tries = 2) { // multipart 폼 전송이라 CORS 사전 요청 없이 바로 올라감
  const fd = new FormData();
  fd.append('reqtype', 'fileupload'); fd.append('time', '1h'); fd.append('fileToUpload', blob, name);
  try {
    const res = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', {method: 'POST', body: fd, signal: AbortSignal.timeout(UPLOAD_TIMEOUT_MS)});
    const url = (await res.text()).trim();
    if (!res.ok || !url.startsWith('https://')) throw new Error(url.slice(0, 60) || res.status);
    return url;
  } catch (e) {
    if (tries > 1) return upload(blob, name, tries - 1);
    throw e.name === 'TimeoutError' ? new Error('시간 초과') : e;
  }
}

const SB_URL = 'https://khmkdznemafpjoyqgrnl.supabase.co', SB_BUCKET = 'nekeot',

async function sbUpload(blob, name, tries = 2) {

// ---------- 카메라 ----------
function cameraError(text) {
  count.className = 'count msg'; count.textContent = text; $('shoot').disabled = true;
}
// 촬영 화면에 들어올 때마다 새로 켬. 숨겨진 화면에서 미리 켜두면 안드로이드 앱에서 화면이 멈춘 채로 나옴
const stopCamera = () => { video.srcObject?.getTracks().forEach(t => t.stop()); video.srcObject = null; };
const frameShown = () => new Promise(r => { video.videoWidth ? r() : video.addEventListener('loadeddata', r, {once: true}); setTimeout(r, 4000); });
function startCamera() {
  if (!navigator.mediaDevices) return Promise.resolve(cameraError('카메라는 https 주소에서만 켜져요.'));
  if (video.srcObject?.getVideoTracks().some(t => t.readyState === 'live')) { video.play().catch(() => {}); return frameShown(); }
  stopCamera();
  // 여러 명 찍기용 광각: 4:3(센서 전체, 16:9처럼 위아래를 안 자름)으로 요청하고, 줌 되는 기기는 줌을 최소로
  return navigator.mediaDevices.getUserMedia({video: {facingMode: 'user', width: {ideal: 1920}, height: {ideal: 1440}, aspectRatio: {ideal: 4/3}}, audio: false})
    .then(s => { if (screen !== 'shoot') return s.getTracks().forEach(t => t.stop()); video.srcObject = s; video.play().catch(() => {});
      const tr = s.getVideoTracks()[0], z = tr.getCapabilities?.().zoom;
      if (z) tr.applyConstraints({advanced: [{zoom: z.min}]}).catch(() => {});
      if (count.classList.contains('msg')) { count.className = 'count'; count.textContent = ''; $('shoot').disabled = false; }
      return frameShown(); })
    .catch(e => cameraError(`카메라를 열 수 없어요 (${e.name}). ${Native ? '설정 → 애플리케이션 → 네컷 부스 → 권한' : '주소창 옆 자물쇠'}에서 카메라를 허용해 주세요.`));
}

document.title = T.title;
document.querySelector('.hero h1').textContent = $('caption').value = T.title;
document.querySelector('.hero .sub').textContent = T.sub;
{ // 행사용(교회·창업·부외대)이라 저장 없이 인쇄가 주 버튼, 공유 없이 인쇄·QR만
  $('save').hidden = true; $('print').classList.add('primary', 'big');
  $('doneSub').textContent = '인쇄하거나 폰으로 받을 수 있어요.';
}
if (ONE_FMT) { // 위 단계 표시에서 '모양'을 빼고 번호를 다시 매김
  document.querySelector('#stepper li[data-s="format"]').remove();
  document.querySelectorAll('#stepper li b').forEach((b, i) => b.textContent = i + 1);
}
setFormat(ONE_FMT || 'strip');
drawFan();
go('start');
document.fonts.load(`800 20px ${FONT}`, T.title + '0123456789.').then(refresh);
</script>
</body>
</html>
